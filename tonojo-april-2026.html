<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>殿上さん 4月勤務表</title>
<style>
  @page {
    size: A5 landscape;
    margin: 8mm;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Meiryo", sans-serif;
    width: 210mm;
    height: 148mm;
    padding: 6mm;
    display: flex;
    flex-direction: column;
  }
  h1 {
    text-align: center;
    font-size: 16px;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }
  .subtitle {
    text-align: center;
    font-size: 11px;
    color: #666;
    margin-bottom: 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    flex: 1;
  }
  th, td {
    border: 1px solid #999;
    text-align: center;
    vertical-align: top;
    padding: 2px 3px;
    font-size: 11px;
  }
  th {
    background: #f0f0f0;
    font-weight: bold;
    height: 22px;
    vertical-align: middle;
  }
  th.sun { color: #d32f2f; background: #fff0f0; }
  th.sat { color: #1565c0; background: #f0f4ff; }
  td { height: 50px; }
  td .day {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 2px;
  }
  td .shift {
    font-size: 16px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 4px;
    display: inline-block;
    margin-top: 2px;
  }
  /* 日曜列 */
  td.sun { background: #fff5f5; }
  td.sun .day { color: #d32f2f; }
  /* 土曜列 */
  td.sat { background: #f5f8ff; }
  td.sat .day { color: #1565c0; }
  /* 祝日 */
  td.holiday .day { color: #d32f2f; }
  td.holiday .holiday-name {
    font-size: 8px;
    color: #d32f2f;
    display: block;
  }
  /* 勤務パターン */
  .shift.am { background: #e3f2fd; color: #1565c0; }
  .shift.pm { background: #fce4ec; color: #c62828; }
  .shift.ampm { background: #e8f5e9; color: #2e7d32; }
  .shift.off { background: #f5f5f5; color: #999; font-weight: normal; font-size: 14px; }
  /* 空セル */
  td.empty { background: #fafafa; }
  /* 凡例 */
  .legend {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 6px;
    font-size: 10px;
    color: #555;
  }
  .legend span {
    padding: 1px 8px;
    border-radius: 3px;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>殿上さん　4月 勤務表</h1>
<div class="subtitle">2026年4月</div>

<table>
  <thead>
    <tr>
      <th class="sun">日</th>
      <th>月</th>
      <th>火</th>
      <th>水</th>
      <th>木</th>
      <th>金</th>
      <th class="sat">土</th>
    </tr>
  </thead>
  <tbody>
    <!-- Week 1: Mar29-Apr4 -->
    <tr>
      <td class="sun empty"></td>
      <td class="empty"></td>
      <td class="empty"></td>
      <td>
        <div class="day">1</div>
      </td>
      <td>
        <div class="day">2</div>
      </td>
      <td>
        <div class="day">3</div>
      </td>
      <td class="sat">
        <div class="day">4</div>
      </td>
    </tr>
    <!-- Week 2: 5-11 -->
    <tr>
      <td class="sun">
        <div class="day">5</div>
      </td>
      <td>
        <div class="day">6</div>
      </td>
      <td>
        <div class="day">7</div>
      </td>
      <td>
        <div class="day">8</div>
      </td>
      <td>
        <div class="day">9</div>
      </td>
      <td>
        <div class="day">10</div>
        <span class="shift pm">午後</span>
      </td>
      <td class="sat">
        <div class="day">11</div>
        <span class="shift am">午前</span>
      </td>
    </tr>
    <!-- Week 3: 12-18 -->
    <tr>
      <td class="sun">
        <div class="day">12</div>
      </td>
      <td>
        <div class="day">13</div>
        <span class="shift am">午前</span>
      </td>
      <td>
        <div class="day">14</div>
        <span class="shift am">午前</span>
      </td>
      <td>
        <div class="day">15</div>
        <span class="shift am">午前</span>
      </td>
      <td>
        <div class="day">16</div>
        <span class="shift off">休み</span>
      </td>
      <td>
        <div class="day">17</div>
        <span class="shift ampm">全日</span>
      </td>
      <td class="sat">
        <div class="day">18</div>
        <span class="shift am">午前</span>
      </td>
    </tr>
    <!-- Week 4: 19-25 -->
    <tr>
      <td class="sun">
        <div class="day">19</div>
      </td>
      <td>
        <div class="day">20</div>
        <span class="shift am">午前</span>
      </td>
      <td>
        <div class="day">21</div>
        <span class="shift ampm">全日</span>
      </td>
      <td>
        <div class="day">22</div>
        <span class="shift off">休み</span>
      </td>
      <td>
        <div class="day">23</div>
        <span class="shift am">午前</span>
      </td>
      <td>
        <div class="day">24</div>
        <span class="shift pm">午後</span>
      </td>
      <td class="sat">
        <div class="day">25</div>
        <span class="shift am">午前</span>
      </td>
    </tr>
    <!-- Week 5: 26-30 -->
    <tr>
      <td class="sun">
        <div class="day">26</div>
      </td>
      <td>
        <div class="day">27</div>
        <span class="shift am">午前</span>
      </td>
      <td>
        <div class="day">28</div>
        <span class="shift am">午前</span>
      </td>
      <td class="holiday">
        <div class="day">29</div>
        <span class="holiday-name">昭和の日</span>
        <span class="shift off">休み</span>
      </td>
      <td>
        <div class="day">30</div>
        <span class="shift am">午前</span>
      </td>
      <td class="empty"></td>
      <td class="sat empty"></td>
    </tr>
  </tbody>
</table>

<div class="legend">
  <div><span class="shift am">午前</span> AM勤務</div>
  <div><span class="shift pm">午後</span> PM勤務</div>
  <div><span class="shift ampm">全日</span> AM+PM勤務</div>
  <div><span class="shift off">休み</span></div>
</div>

</body>
</html>
